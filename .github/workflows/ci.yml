name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m py_compile core/engine.py core/security.py core/tui.py web/server.py
      - name: Check shell scripts
        run: bash -n scripts/backup.sh install_genio_os.sh update_genio.sh
      - name: Run tests
        run: pytest -q
