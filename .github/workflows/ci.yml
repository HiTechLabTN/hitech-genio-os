name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q core web tests
      - name: Check shell scripts
        run: bash -n scripts/backup.sh install_genio_os.sh update_genio.sh
      - name: Check locale catalogue
        run: python -c "from core import i18n; r = i18n.key_report(); assert r['ok'], r['missing']; print(r['keys'], 'keys OK')"
      - name: Run tests
        run: pytest -q
