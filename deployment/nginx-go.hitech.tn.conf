# go.hitech.tn — nginx أمام Genio OS (اختياري إذا تستعمل cloudflared مباشرة)
#
# المسار: Cloudflare → (tunnel ولا nginx) → uvicorn على 127.0.0.1:8099
# التثبيت:
#   sudo cp deployment/nginx-go.hitech.tn.conf /etc/nginx/sites-available/go.hitech.tn
#   sudo ln -s /etc/nginx/sites-available/go.hitech.tn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    # cloudflared tunnel يكلّم nginx محليًا. إذا Cloudflare يضرب الأصل مباشرة،
    # بدّل السطر بـ: listen 8080;  (وحطّ شهادة Origin في CF).
    listen 127.0.0.1:8090;
    server_name go.hitech.tn;

    # ZIP / رفع المشاريع
    client_max_body_size 32m;

    # SSE (/api/task/stream) يبقى مفتوح و بلا buffering
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        # IP الحقيقي: Cloudflare يكتبو في CF-Connecting-IP، و المنصّة تقراه
        # (core/proxy.py) غير كي الطلب جاي من 127.0.0.1.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header True-Client-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # صحة الخدمة من داخل السيرفر (بلا Cloudflare Access)
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8099/api/health;
        proxy_set_header Host $host;
    }
}
